<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage calculator — Lots Of Calcs</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lotsofcalcs.com/percent/">
<link rel="stylesheet" href="/styles.css?v=2949b606">
<base target="_blank">
</head>
<body class="embed-body">
  <div class="page embed-page">
    <p class="embed-head"><a href="/percent/">Percentage calculator</a></p>
<main class="tool">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="of">X% of Y</button>
        <button class="tab" data-tab="is-what">X is what % of Y</button>
        <button class="tab" data-tab="change">% change</button>
      </div>

      <div class="tab-panel active" data-panel="of">
        <p class="tool-hint">What is X% of Y?</p>
        <div class="field-row">
          <div class="field">
            <label for="of-pct">Percentage (X)</label>
            <input type="number" id="of-pct" placeholder="0" step="any" value="20">
          </div>
          <div class="field">
            <label for="of-value">Of value (Y)</label>
            <input type="number" id="of-value" placeholder="0.00" step="any" value="50">
          </div>
        </div>
        <div class="result-box">
          <div class="result-hero">
            <div class="value" id="of-result">0</div>
            <div class="label">Result</div>
          </div>
        </div>
      </div>

      <div class="tab-panel" data-panel="is-what">
        <p class="tool-hint">X is what percent of Y?</p>
        <div class="field-row">
          <div class="field">
            <label for="iw-x">X</label>
            <input type="number" id="iw-x" placeholder="0.00" step="any" value="15">
          </div>
          <div class="field">
            <label for="iw-y">Y</label>
            <input type="number" id="iw-y" placeholder="0.00" step="any" value="60">
          </div>
        </div>
        <div class="result-box">
          <div class="result-hero">
            <div class="value" id="iw-result">0%</div>
            <div class="label">Result</div>
          </div>
        </div>
      </div>

      <div class="tab-panel" data-panel="change">
        <p class="tool-hint">Percentage change from one value to another.</p>
        <div class="field-row">
          <div class="field">
            <label for="ch-from">From</label>
            <input type="number" id="ch-from" placeholder="0.00" step="any" value="80">
          </div>
          <div class="field">
            <label for="ch-to">To</label>
            <input type="number" id="ch-to" placeholder="0.00" step="any" value="100">
          </div>
        </div>
        <div class="result-box">
          <div class="result-hero">
            <div class="value" id="ch-result">0%</div>
            <div class="label" id="ch-label">Change</div>
          </div>
        </div>
      </div>
    </main>
    <p class="embed-foot">Free from <a href="https://lotsofcalcs.com/percent/">Lots Of Calcs</a> — all calculations run in your browser.</p>
  </div>
  <script src="/percent.js?v=5e2d0e41"></script>
</body>
</html>
